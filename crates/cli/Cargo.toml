[package]
name = "nds-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.4", path = "../io" }
nddev-device-sync-accounts = { version = "=0.0.1-alpha.24", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts", rev = "db82bf49716a9539d2ab2ce42e9f530ced9d43e8" }
nddev-device-sync-vault = { version = "=0.0.1-alpha.11", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-vault", rev = "6da85e299e9155f08d9ddcdefaf5d25970180409" }
serde_json = "1"
tracing = "0.1"
nddev-device-sync-telemetry = { version = "=0.0.1-alpha.11", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability", rev = "c63a39da62b7b1b083149f2da5c9205f125e2190", features = ["client-traces"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1.8"

[features]
development-http = ["nddev-device-sync-accounts/development-http", "nddev-device-sync-vault/development-http"]

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
