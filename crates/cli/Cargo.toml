[package]
name = "nds-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.2", path = "../io" }
nddev-device-sync-accounts = { version = "=0.0.1-alpha.17", git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-accounts", rev = "e4f41528fdd668ce32105576546e84d2bea5b05f" }
nddev-device-sync-vault = { version = "=0.0.1-alpha.4", git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-vault", rev = "cf8b39f5f273b976ee03d72b102b5c3a3fafcfe5" }
serde_json = "1"
tracing = "0.1"
nddev-device-sync-telemetry = { version = "=0.0.1-alpha.5", git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-observability", rev = "469a77aea2e234b50d0554625a761d52985e7cb0", features = ["client-traces"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1.8"

[features]
development-http = ["nddev-device-sync-accounts/development-http", "nddev-device-sync-vault/development-http"]

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
