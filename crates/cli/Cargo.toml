[package]
name = "nds-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.3", path = "../io" }
nddev-device-sync-accounts = { version = "=0.0.1-alpha.18", git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-accounts", rev = "1a2266342f2a981ffbd3de9bc9219549d3e5bf54" }
nddev-device-sync-vault = { version = "=0.0.1-alpha.5", git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-vault", rev = "3f31eb793878bc1423810ef0692a12e084ea895d" }
serde_json = "1"
tracing = "0.1"
nddev-device-sync-telemetry = { version = "=0.0.1-alpha.6", git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-observability", rev = "f3a7c16d0df0f0dc3912284db2e97d6894aaf5a0", features = ["client-traces"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1.8"

[features]
development-http = ["nddev-device-sync-accounts/development-http", "nddev-device-sync-vault/development-http"]

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
