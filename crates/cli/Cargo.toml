[package]
name = "nds-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.3", path = "../io" }
nddev-device-sync-accounts = { version = "=0.0.1-alpha.18", git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-accounts", rev = "7fabebd60063e0f46c815d1ae979490399166d51" }
nddev-device-sync-vault = { version = "=0.0.1-alpha.5", git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-vault", rev = "673f20f69fae13ebe88d1e8ce2b8e287668a7f10" }
serde_json = "1"
tracing = "0.1"
nddev-device-sync-telemetry = { version = "=0.0.1-alpha.7", git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-observability", rev = "4b8dfb54168db648f76fb39d2d0cfb1ba7133a9b", features = ["client-traces"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1.8"

[features]
development-http = ["nddev-device-sync-accounts/development-http", "nddev-device-sync-vault/development-http"]

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
